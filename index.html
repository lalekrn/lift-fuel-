const KEY='mein-balance-v1';const defaults={recipes:[{id:'demo',name:'Tofu-Reis-Bowl',category:'Abendessen',portions:1,calories:650,protein:35,carbs:78,fat:22,ingredients:[{name:'Reis',amount:100,unit:'g'},{name:'Räuchertofu',amount:150,unit:'g'},{name:'Brokkoli',amount:200,unit:'g'},{name:'Paprika',amount:100,unit:'g'}],steps:[{text:'Reis nach Packungsangabe kochen.'},{text:'Brokkoli und Paprika klein schneiden und garen.'},{text:'Tofu anbraten und alles in einer Schüssel anrichten.'}]}],plan:{},checked:{},weights:[],measurements:[],workouts:[],profile:{weight:'',height:'',age:'',activity:'1.55',goal:'maintain'},eaten:{},nutritionGoals:{calories:2100,protein:100,carbs:260,fat:70},trainingPlan:{},trainingDone:{}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{data=structuredClone(defaults)};for(const k in defaults)if(data[k]===undefined)data[k]=structuredClone(defaults[k]);let page='Start',detail=null,editing=null,detailFrom=null,recipeCategory='Alle',trainingDay=dateISO(new Date());const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Speicher voll. Bitte Fotos verkleinern und Backup exportieren.')}}function go(p){page=p;detail=null;detailFrom=null;render();scrollTo(0,0)}function openRecipe(id){detailFrom=page;detail=id;render();scrollTo(0,0)}function closeRecipe(){detail=null;page=detailFrom||page;detailFrom=null;render()}const navs=[['Start','⌂'],['Rezepte','▤'],['Wochenplan','▦'],['Ernährung','◉'],['Mehr','☰']];function original_render(){ $('nav').innerHTML=navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${i}<br>${n}</button>`).join('');$('view').innerHTML=detail?recipeDetail(detail):page==='Start'?home():page==='Rezepte'?recipes():page==='Wochenplan'?planner():page==='Ernährung'?nutrition():more();if(page==='Mehr'&&sub==='Training'&&!detail){ensureExerciseDraft();drawPlannedExercises()}}function todayKey(){return dateISO(new Date())}function eatenFor(day){return data.eaten[day]||{}}function mealTotals(day){let entries=eatenFor(day),sum={calories:0,protein:0,carbs:0,fat:0};for(let [id,portions] of Object.entries(entries)){let r=data.recipes.find(x=>x.id===id);if(!r)continue;for(let k in sum)sum[k]+=Number(r[k]||0)*Number(portions||0)}return sum}function nutritionBars(day){let t=mealTotals(day),g=data.nutritionGoals;return [['Kalorien','calories','kcal'],['Protein','protein','g'],['Kohlenhydrate','carbs','g'],['Fett','fat','g']].map(([label,key,unit])=>`<div class="macro"><div class="row"><b>${label}</b><small>${Math.round(t[key])} / ${g[key]} ${unit}</small></div><div class="bar"><div style="width:${Math.min(100,t[key]/Math.max(1,g[key])*100)}%"></div></div></div>`).join('')}function original_home(){let day=todayKey(),planned=meals.map(m=>data.plan[day+'|'+m]).filter(Boolean).map(id=>data.recipes.find(r=>r.id===id)).filter(Boolean),cal=planned.reduce((a,r)=>a+Number(r.calories||0),0);return `<div class="hero"><small>Willkommen zurück</small><h2>Gut essen. Stark werden.</h2><p>Dein Training, deine Ernährung und deine Fortschritte an einem Ort.</p><button onclick="go('Wochenplan')">Woche planen →</button></div><div class="card"><div class="row"><h3>Heute gegessen</h3><button class="secondary" onclick="go('Ernährung')">Eintragen →</button></div>${nutritionBars(day)}</div><div class="grid"><div class="card"><small>Heute geplant</small><h2>${cal} kcal</h2><small>Nicht automatisch gegessen</small></div><div class="card"><small>Rezepte</small><h2>${data.recipes.length}</h2><small>Im Rezeptbuch</small></div></div><h2>Deine Bereiche</h2><div class="grid">${[['Rezepte','Rezeptbuch'],['Wochenplan','Wochenplan'],['Ernährung','Nährwerte'],['Mehr','Training & Einkauf']].map(([p,t])=>`<button class="secondary" onclick="go('${p}')">${t} →</button>`).join('')}</div><p class="muted tiny">Nähr ddIngredient()">+ Zutat</button><h2>Anleitung mit Bildern</h2><div id="stepFields"></div><button class="secondary" onclick="addStep()">+ Schritt</button><hr><button onclick="saveRecipe()">Rezept speichern</button>`;drawIngredients();drawSteps()}function drawIngredients(){let el=$('ingredientFields');if(!el)return;el.innerHTML=draft.ingredients.map((i,n)=>`<div class="card"><label>Zutat<input value="${esc(i.name)}" oninput="draft.ingredients[${n}].name=this.value"></label><div class="grid"><label>Menge<input type="number" value="${esc(i.amount)}" oninput="draft.ingredients[${n}].amount=this.value"></label><label>Einheit<input value="${esc(i.unit)}" oninput="draft.ingredients[${n}].unit=this.value"></label></div><button class="danger" onclick="draft.ingredients.splice(${n},1);drawIngredients()">Entfernen</button></div>`).join('')}function addIngredient(){draft.ingredients.push({name:'',amount:'',unit:'g'});drawIngredients()}function drawSteps(){let el=$('stepFields');if(!el)return;el.innerHTML=draft.steps.map((s,n)=>`<div class="card"><b>Schritt ${n+1}</b><textarea oninput="draft.steps[${n}].text=this.value">${esc(s.text)}</textarea>${s.photo?`<img class="preview" src="${s.photo}">`:''}<label>Schrittbild<input type="file" accept="image/*" onchange="imageInput(this,v=>{draft.steps[${n}].photo=v;drawSteps()})"></label><button class="danger" onclick="draft.steps.splice(${n},1);drawSteps()">Entfernen</button></div>`).join('')}function addStep(){draft.steps.push({text:''});drawSteps()}function imageInput(input,cb){let f=input.files?.[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.65));URL.revokeObjectURL(url)};img.src=url}function saveRecipe(){let name=$('rname').value.trim();if(!name)return aler function dateISO(d){let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}let monday=(()=>{let d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(12,0,0,0);return d})();const meals=['Frühstück','Mittagessen','Abendessen','Snack','Shakes & Smoothies','Kuchen & Torten'];function original_planner(){return `<div class="row"><h2>Wochenplan</h2><button class="secondary" onclick="monday.setDate(monday.getDate()+7);render()">Nächste →</button></div><button class="secondary" onclick="monday.setDate(monday.getDate()-7);render()">← Vorherige</button>${Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);let day=dateISO(d);return `<div class="day"><h3>${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'short'})}</h3>${meals.map(m=>{let key=day+'|'+m,r=data.recipes.find(x=>x.id===data.plan[key]);return `<div class="card meal-row"><div class="meal-open" ${r?`onclick="openRecipe('${r.id}')"`:''}>${r?.photo?`<img class="mealpic" src="${r.photo}">`:`<div class="mealpic" style="display:grid;place-items:center">${r?'🍽️':'+'}</div>`}<div style="min-width:0"><small>${m}</small><b>${r?esc(r.name):'Noch nichts geplant'}</b>${r?`<small>${Number(r.calories||0)} kcal · Rezept öffnen →</small>`:''}</div></div><select aria-label="${m} auswählen" onchange="setMeal('${key}',this.value)"><option value="">+ Auswählen</option>${data.recipes.map(x=>`<option value="${x.id}" ${r?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}).join('')}</div>`}).join('')}`}function setMeal(k,v){if(v)data.plan[k]=v;else delete data.plan[k];save();render()}function original_shopping(){let totals={};for(let [key,id] of Object.entries(data.plan)){let r=data.recipes.find(r=>r.id===id);if(!r)continue;for(let i of r.ingredients){let k=i.name.trim().toLowerCase()+'|'+i.unit;let t=totals[k]||(totals[k]={name:i.name,unit:i.unit,amount:0,photo:i.photo});t.amount+=Number(i.amount)||0}}return `<h2>Einkaufsliste</h2><p class="muted">Automatisch aus allen geplanten Mahlzeiten erstellt. Gleiche Zutaten und Einheiten werden zusammengefasst.</p>${Object.entries(totals).length?Object.entries(totals).map(([k,i])=>`<div class="row card"><input type="checkbox" style="width:22px;margin:0" ${data.checked[k]?'checked':''} onchange="data.checked['${esc(k)}']=this.checked;save()">${i.photo?`<img class="thumb" src="${i.photo}">`:''}<span style="flex:1">${esc(i.name)}</span><b>${i.amount} ${esc(i.unit)}</b></div>`).join(''):'<div class="card">Plane zuerst Mahlzeiten im Wochenplan.</div>'}<button class="secondary" onclick="data.checked={};save();render()">Häkchen zurücksetzen</button>`}
function nutrition(){let day=todayKey(),entries=eatenFor(day);return `<h2>Ernährung & Nährwerte</h2><p class="muted">Trage ein, was du tatsächlich gegessen hast. Dein Wochenplan ist nur eine Planung.</p><div class="card"><h3>Heute · ${new Date().toLocaleDateString('de-DE')}</h3>${nutritionBars(day)}</div><div class="card"><h3>Mahlzeit eintragen</h3><div class="food-row"><select id="foodRecipe">${data.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><input id="foodPortions" type="number" min="0.1" step="0.5" value="1" aria-label="Portionen"><button onclick="addFood()">+</button></div><small>Portionen gemäß den Nährwerten des Rezepts.</small></div><h3>Heute gegessen</h3>${Object.entries(entries).map(([id,n])=>{let r=data.recipes.find(x=>x.id===id);return r?`<div class="card row"><div><b>${esc(r.name)}</b><br><small>${n} Portion(en) · ${Math.round(n*Number(r.calories||0))} kcal</small></div><button class="danger" onclick="removeFood('${id}')">×</button></div>`:''}).join('')||'<div class="card">Noch nichts eingetragen.</div>'}<h3>Deine Tagesziele</h3><div class="card"><div class="grid">${[['Kalorien (kcal)','calories'],['Protein (g)','protein'],['Kohlenhydrate (g)','carbs'],['Fett (g)','fat']].map(([label,k])=>`<label>${label}<input type="number" min="0" id="goal${k}" value="${data.nutritionGoals[k]}"></label>`).join('')}</div><button onclick="saveNutritionGoals()">Ziele speichern</button></div><p class="muted tiny">Die Startwerte sind veränderbare Beispiele, keine medizinisch ermittelten Vorgaben.</p>`}function addFood(){let id=$('foodRecipe')?.value,n=Number($('foodPortions')?.value);if(!id||!Number.isFinite(n)||n<=0)return alert('Bitte Rezept und gültige Portionen wählen.');let d=todayKey();data.eaten[d]||={};data.eaten[d][id]=(Number(data.eaten[d][id])||0)+n;save();render()}function removeFood(id){let d=todayKey();delete data.eaten[d][id];save();render()}function saveNutritionGoals(){for(let k of ['calories','protein','carbs','fat']){let n=Number($('goal'+k).value);if(!Number.isFinite(n)||n<=0)return alert('Bitte positive Tagesziele eintragen.');data.nutritionGoals[k]=n}save();render()}let sub='Training';function original_more(){return `<div class="tabs">${['Training','Einkauf','Fortschritt','Profil','Backup'].map(s=>`<button class="${sub===s?'':'secondary'}" onclick="sub='${s}';render()">${s}</button>`).join('')}</div>${sub==='Training'?training():sub==='Einkauf'?shopping():sub==='Fortschritt'?progress():sub==='Profil'?profile():backup()}`}function training(){let d=trainingDay,stored=data.trainingPlan[d],plan=Array.isArray(stored)?stored:[],legacy=typeof stored==='string'?stored:'',entries=data.workouts.filter(w=>w.date===d),done=!!data.trainingDone[d];return `<h2>Trainingsjournal</h2><div class="row"><button class="secondary" onclick="shiftTraining(-7)">← Woche</button><small>${esc(d)}</small><button class="secondary" onclick="shiftTraining(7)">Woche →</button></div><div class="grid" style="grid-template-columns:repeat(7,1fr);gap:3px;margin:12px 0">${Array.from({length:7},(_,i)=>{let base=new Date(d+'T12:00:00'),offset=(base.getDay()+6)%7;base.setDate(base.getDate()-offset+i);let date=dateISO(base);return `<button class="workday ${d===date?'active':'secondary'}" onclick="selectTrainingDay('${date}')">${['Mo','Di','Mi','Do','Fr','Sa','So'][i]}<br>${base.getDate()}${data.trainingDone[date]?' ✓':''}</button>`}).join('')}</div><div class="card"><h3>Trainingsplan für ${esc(d)}</h3><p class="muted tiny">Trage deine Übungen für diesen Tag direkt ein.</p>${legacy?`<p class="muted">Bisherige Notiz: ${esc(legacy)}</p>`:''}<div id="plannedExercises"></div><button class="secondary" onclick="addPlannedExercise()">+ Übung hinzufügen</button><hr><button onclick="saveTrainingExercises()">Tagesplan speichern</button><button class="${done?'secondary':'done-button'}" style="margin-left:6px;margin-top:8px" onclick="toggleTrainingDone()">${done?'✓ Absolviert – zurücksetzen':'✓ Training absolviert'}</button></div><h3>Bereits dokumentierte Übungen</h3>${entries.map(w=>`<div class="card row"><div><b>${esc(w.exercise)}</b><br><small>${w.sets} × ${w.reps} · ${w.load} kg</small></div><button class="danger" onclick="data.workouts=data.workouts.filter(x=>x.id!==${w.id});save();render()">×</button></div>`).join('')||'<p class="muted">Noch keine absolvierten Übungen dokumentiert.</p>'}<h3>Letzte Einträge</h3>${[...data.workouts].reverse().slice(0,8).map(w=>`<div class="card compact">${esc(w.date)} · ${esc(w.exercise)} · ${w.sets} × ${w.reps} · ${w.load} kg</div>`).join('')||'<p class="muted">Noch keine Einträge.</p>'}`}

 let dict=translations[lang];let walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);

function home(){let day=todayKey(),total=mealTotals(day),goals=data.nutritionGoals,planToday=meals.map(m=>({meal:m,recipe:data.recipes.find(r=>r.id===data.plan[day+'|'+m])})).filter(x=>x.recipe),work=data.trainingPlan[day],done=!!data.trainingDone[day],pct=(v,g)=>Math.min(100,Math.max(0,Math.round(100*v/Math.max(1,g))));return `<div class="hero"><small>Willkommen zurück</small><h2>Gut essen. Stark werden.</h2><p>Dein Training, deine Ernährung und deine Fortschritte an einem Ort.</p></div><div class="grid"><div class="card"><div class="stat-label">Kalorien-Ziel</div><div class="metric">${Math.round(total.calories)} <small>/ ${goals.calories}</small></div><div class="progress-track"><div class="progress-fill" style="width:${pct(total.calories,goals.calories)}%"></div></div></div><div class="card"><div class="stat-label">Protein-Ziel</div><div class="metric">${Math.round(total.protein)} <small>/ ${goals.protein} g</small></div><div class="progress-track"><div class="progress-fill" style="width:${pct(total.protein,goals.protein)}%"></div></div></div></div><div class="card"><div class="section-head"><h3>Heute geplant</h3><button class="secondary small-action" onclick="go('Wochenplan')">Woche planen →</button></div>${planToday.length?planToday.map(x=>`<div class="ingredient-line"><span><small>${tr(x.meal)}</small><br><b class="user-text">${esc(x.recipe.name)}</b></span><span>${Math.round(x.recipe.calories||0)} kcal</span></div>`).join(''):'<p class="muted">Heute noch nicht geplant</p>'}</div><div class="card"><div class="section-head"><h3>Dein Training heute</h3><button class="secondary small-action" onclick="sub='Training';trainingDay=todayKey();go('Mehr')">Training öffnen →</button></div><p>${done?'✓ '+tr('Training absolviert'):Array.isArray(work)&&work.length?work.map(x=>`<span class="tag user-text">${esc(x.exercise)}</span>`).join(' '):tr('Noch nichts geplant')}</p></div><div class="grid"><div class="card"><small>Gespeicherte Rezepte</small><div class="metric">${data.recipes.length}</div></div><div class="card"><small>Lieblingsrezepte</small><div class="metric">${data.favorites.length}</div></div></div>`}
function recipes(){let cats=['Alle','Frühstück','Mittagessen','Abendessen','Snack','Shakes & Smoothies','Kuchen & Torten'];return `<div class="row"><h2>Mein Rezeptbuch</h2><button onclick="editRecipe()">+ Rezept</button></div><input id="search" placeholder="Rezepte suchen …" value="${esc(recipeQuery)}" oninput="recipeQuery=this.value;filterRecipes()"><div class="tabs">${cats.map(c=>`<button class="${recipeCategory===c?'':'secondary'}" onclick="recipeCategory='${c}';render()">${tr(c)}</button>`).join('')}</div><div class="card"><div class="filter-row"><button class="${recipeFavOnly?'':'secondary'} small-action" onclick="recipeFavOnly=!recipeFavOnly;render()">♥ ${tr('Favoriten')}</button><select aria-label="Sortieren" onchange="recipeSort=this.value;filterRecipes()"><option value="name" ${recipeSort==='name'?'selected':''}>${tr('Name')}</option><option value="protein" ${recipeSort==='protein'?'selected':''}>${tr('Protein (hoch)')}</option><option value="calories" ${recipeSort==='calories'?'selected':''}>${tr('Kalorien (niedrig)')}</option></select></div><div class="grid"><label>${tr('Min. Protein')} (g)<input type="number" min="0" value="${recipeProteinMin||''}" oninput="recipeProteinMin=Number(this.value)||0;filterRecipes()"></label><label>${tr('Max. kcal')}<input type="number" min="0" value="${recipeCalMax||''}" oninput="recipeCalMax=Number(this.value)||0;filterRecipes()"></label></div></div><div id="recipeGrid" class="grid" style="margin-top:14px">${recipeListing(recipeQuery)}</div>`}
function recipeListing(q){let rs=data.recipes.filter(r=>(recipeCategory==='Alle'||r.category===recipeCategory)&&r.name.toLowerCase().includes((q||'').toLowerCase())&&(!recipeFavOnly||data.favorites.includes(r.id))&&Number(r.protein||0)>=recipeProteinMin&&(!recipeCalMax||Number(r.calories||0)<=recipeCalMax));rs.sort(recipeSort==='protein'?(a,b)=>Number(b.protein||0)-Number(a.protein||0):recipeSort==='calories'?(a,b)=>Number(a.calories||0)-Number(b.calories||0):(a,b)=>a.name.localeCompare(b.name));if(!rs.length)return `<p class="muted">${tr('Keine Rezepte in dieser Kategorie.')}</p>`;if(recipeCategory!=='Alle')return rs.map(recipeCardEnhanced).join('');let cats=['Frühstück','Mittagessen','Abendessen','Snack','Shakes & Smoothies','Kuchen & Torten'];return [...cats,...new Set(rs.map(r=>r.category).filter(c=>!cats.includes(c)))].map(c=>{let group=rs.filter(r=>r.category===c);return group.length?`<h3 class="category-header">${tr(c)}</h3>${group.map(recipeCardEnhanced).join('')}`:''}).join('')}
function recipeCardEnhanced(r){let fav=data.favorites.includes(r.id);return `<div class="recipe-tile"><button class="fav-btn ${fav?'on':''}" aria-label="${tr('Favoriten')}" onclick="toggleFavorite('${r.id}')">${fav?'♥':'♡'}</button><div class="card" style="margin:0;cursor:pointer" onclick="openRecipe('${r.id}')">${r.photo?`<img class="recipepic" src="${r.photo}">`:`<div class="recipepic" style="display:grid;place-items:center;font-size:36px">🥗</div>`}<b class="user-text">${esc(r.name)}</b><br><small>${tr(r.category||'Rezept')} · ${Number(r.calories||0)} kcal · ${Number(r.protein||0)} g</small></div></div>`}

function filterRecipes(){let el=$('recipeGrid');if(el)el.innerHTML=recipeListing($('search')?.value||recipeQuery)}
function recipeDetail(id){let r=data.recipes.find(x=>x.id===id);if(!r)return '';let base=Math.max(.1,Number(r.portions)||1),count=portionView[id]||base,factor=count/base,fav=data.favorites.includes(id);return `<div class="row"><button class="secondary" onclick="closeRecipe()">← ${tr('Zurück')}</button><button class="fav-btn ${fav?'on':''}" onclick="toggleFavorite('${id}')">${fav?'♥':'♡'} ${tr('Favoriten')}</button></div><h2 class="user-text">${esc(r.name)}</h2>${r.photo?`<img class="preview" src="${r.photo}">`:''}<p>${tr(r.category||'Rezept')}</p><div class="card"><div class="setting-row"><b>${tr('Portionen anzeigen')}</b><div class="row"><button class="secondary small-action" onclick="changePortions('${id}',-1)">−</button><b>${count}</b><button class="secondary small-action" onclick="changePortions('${id}',1)">+</button></div></div><hr><div class="grid"><div><small>${tr('Gesamt')}</small><h3>${Math.round((r.calories||0)*count)} kcal</h3></div><div><small>${tr('Protein')}</small><h3>${Math.round((r.protein||0)*count)} g</h3></div></div><small>${r.calories||0} kcal · ${r.protein||0} g ${tr('pro Portion')}</small></div><h2>${tr('Zutaten')}</h2><div class="card">${(r.ingredients||[]).map(i=>`<div class="ingredient-line"><span class="user-text">${esc(i.name)}</span><b>${formatAmount((Number(i.amount)||0)*factor)} ${esc(i.unit)}</b></div>`).join('')}</div><h2>${tr('Zubereitung')}</h2>${(r.steps||[]).map((s,i)=>`<div class="step"><b>${data.preferences.language==='en'?'Step':data.preferences.language==='es'?'Paso':'Schritt'} ${i+1}</b><p class="user-text">${esc(s.text)}</p>${s.photo?`<img class="preview" src="${s.photo}">`:''}</div>`).join('')}<div class="row"><button onclick="editRecipe('${r.id}')">${tr('Bearbeiten')}</button><button class="danger" onclick="deleteRecipe('${r.id}')">${tr('Löschen')}</button></div>`}
function changePortions(id,delta){let r=data.recipes.find(x=>x.id===id);let n=portionView[id]||Math.max(.1,Number(r?.portions)||1);portionView[id]=Math.max(.5,Math.round((n+delta)*2)/2);render()}
function formatAmount(v){return Number(v.toFixed(2)).toLocaleString(data.preferences.language==='en'?'en-US':data.preferences.language==='es'?'es-ES':'de-DE')}
function autoFillWeek(){let recipes=data.recipes.filter(r=>r.id!=='demo'||data.recipes.length===1);if(!recipes.length)return alert('Bitte zuerst Rezepte anlegen.');let days=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);return dateISO(d)}),targets=data.nutritionGoals,mealWeights={'Frühstück':.25,'Mittagessen':.35,'Abendessen':.32,'Snack':.08,'Shakes & Smoothies':.08,'Kuchen & Torten':.08};let filled=0;for(let day of days){let assigned=meals.map(m=>data.recipes.find(r=>r.id===data.plan[day+'|'+m])).filter(Boolean),cal=assigned.reduce((s,r)=>s+Number(r.calories||0),0),protein=assigned.reduce((s,r)=>s+Number(r.protein||0),0);for(let meal of meals){let key=day+'|'+meal;if(data.plan[key])continue;let choices=recipes.filter(r=>r.category===meal);if(!choices.length)continue;let ranked=choices.map(r=>{let previous=days.reduce((n,d)=>n+Number(data.plan[d+'|'+meal]===r.id),0),targetCal=targets.calories*(mealWeights[meal]||.1),targetProtein=targets.protein*(mealWeights[meal]||.1);let score=Math.abs(Number(r.calories||0)-targetCal)/Math.max(100,targetCal)+Math.abs(Number(r.protein||0)-targetProtein)/Math.max(10,targetProtein)*.45+previous*.28+Math.max(0,cal+Number(r.calories||0)-targets.calories)/Math.max(200,targets.calories);return {r,score}}).sort((a,b)=>a.score-b.score);data.plan[key]=ranked[0].r.id;cal+=Number(ranked[0].r.calories||0);protein+=Number(ranked[0].r.protein||0);filled++}}save();render();alert(`${filled} ${data.preferences.language==='en'?'meal slots filled':data.preferences.language==='es'?'comidas añadidas':'Mahlzeiten eingetragen'}.`)}
function planner(){let html=basePlanner();let btn=`<div class="week-summary"><div class="row"><div><b>${tr('Automatisch planen')}</b><br><small>${tr('Nur freie Felder')}</small></div><button onclick="autoFillWeek()">${tr('Woche füllen')} ✨</button></div><small>${data.preferences.language==='en'?'Uses saved recipes and approximate nutrition targets; does not guarantee exact daily goals.':data.preferences.language==='es'?'Utiliza tus recetas y objetivos aproximados; no garantiza valores exactos.':'Nutzt deine gespeicherten Rezepte und ungefähre Nährwertziele. Exakte Tagesziele sind nicht garantiert.'}</small></div>`;return btn+html}
function groceryCategory(name){let n=String(name).toLowerCase();if(/brokkoli|paprika|gurke|tomate|spinat|salat|karotte|zwiebel|knoblauch|beere|apfel|banane|pilz|zucchini|kartoffel|obst|gemüse|avocado|zitrone|limette/.test(n))return 'Gemüse & Obst';if(/reis|nudel|pasta|brot|toast|hafer|mehl|couscous|wrap|müsli|granola|gnocchi/.test(n))return 'Getreide & Brot';if(/tofu|linsen|bohne|kichererbse|tempeh|seitan|proteinpulver/.test(n))return 'Proteinquellen';if(/joghurt|quark|skyr|käse|feta|milch|ei\b|eier|mozzarella/.test(n))return 'Milchprodukte & Eier';if(/wasser|saft|tee|kaffee/.test(n))return 'Getränke';return 'Gewürze & Sonstiges'}
function shopping(){let totals=new Map(),weekDays=new Set(Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);return dateISO(d)}));for(let [key,id] of Object.entries(data.plan)){if(!weekDays.has(key.split('|')[0]))continue;let r=data.recipes.find(x=>x.id===id);if(!r)continue;for(let i of r.ingredients||[]){let name=String(i.name||'').trim(),unit=String(i.unit||'').trim();if(!name)continue;let k=name.toLocaleLowerCase()+'|'+unit.toLocaleLowerCase();let row=totals.get(k)||{name,unit,amount:0,key:k};row.amount+=Number(i.amount)||0;totals.set(k,row)}}for(let i of data.extraShopping){let key='manual|'+i.id;totals.set(key,{...i,key})}let groups={};for(let item of totals.values()){let cat=groceryCategory(item.name);(groups[cat]??=[]).push(item)}let order=['Gemüse & Obst','Getreide & Brot','Proteinquellen','Milchprodukte & Eier','Getränke','Gewürze & Sonstiges'];return `<h2>${tr('Einkaufsliste')}</h2><p class="muted">${tr('Einkauf für diese Woche')} · ${monday.toLocaleDateString(data.preferences.language==='es'?'es-ES':data.preferences.language==='en'?'en-GB':'de-DE')}</p><div class="card"><h3>${tr('Eigene Zutat hinzufügen')}</h3><div class="grid"><input id="extraItem" placeholder="${tr('Zutaten')}" aria-label="${tr('Zutaten')}"><input id="extraAmount" placeholder="${tr('Menge')}" aria-label="${tr('Menge')}"></div><div class="row"><input id="extraUnit" placeholder="${tr('Einheit')}" aria-label="${tr('Einheit')}"><button onclick="addShoppingItem()">+ ${tr('Einkauf hinzufügen')}</button></div></div>${totals.size?order.filter(c=>groups[c]?.length).map(c=>`<div class="card grocery-section"><h3>${tr(c)}</h3>${groups[c].sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<div class="grocery-item ${data.checked[i.key]?'checked':''}"><input type="checkbox" ${data.checked[i.key]?'checked':''} onchange="data.checked[decodeURIComponent('${encodeURIComponent(i.key)}')]=this.checked;save();render()"><span class="user-text" style="flex:1">${esc(i.name)}</span><b>${formatAmount(Number(i.amount)||0)} ${esc(i.unit)}</b>${i.id?`<button class="danger small-action" onclick="removeShoppingItem('${i.id}')">×</button>`:''}</div>`).join('')}</div>`).join(''):'<div class="card">Plane zuerst Mahlzeiten im Wochenplan.</div>'}<button class="secondary" onclick="data.checked={};save();render()">${tr('Häkchen zurücksetzen')}</button>`}

function progress(){let html=baseProgress(),entries=data.workouts.filter(w=>w.exercise),names=[...new Set(entries.map(w=>String(w.exercise).trim()))].sort(),chosen=window.progressExercise||names[0];if(!names.length)return html+`<div class="card"><h3>${tr('Trainingsentwicklung')}</h3><p>${tr('Noch keine Trainingsdaten vorhanden.')}</p></div>`;if(!names.includes(chosen))chosen=names[0];let records=entries.filter(w=>String(w.exercise).trim()===chosen).sort((a,b)=>a.date.localeCompare(b.date)),last=records.at(-1),best=records.reduce((a,b)=>Number(b.load||0)>Number(a.load||0)?b:a,records[0]);let points=records.slice(-15),loads=points.map(w=>Number(w.load||0)),lo=Math.min(...loads,0),hi=Math.max(...loads,1),line=loads.map((v,i)=>`${10+i*280/Math.max(1,loads.length-1)},${110-90*(v-lo)/Math.max(1,hi-lo)}`).join(' ');return html+`<div class="card"><h3>${tr('Trainingsentwicklung')}</h3><label>${tr('Übung auswählen')}<select onchange="window.progressExercise=this.value;render()">${names.map(n=>`<option value="${esc(n)}" ${n===chosen?'selected':''}>${esc(n)}</option>`).join('')}</select></label><svg viewBox="0 0 300 125" width="100%" role="img" aria-label="${tr('Trainingsentwicklung')}"><polyline points="${line}" fill="none" stroke="#527f81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="grid"><div class="mini-card"><small>${tr('Letzte Leistung')}</small><h3>${last.load} kg</h3><small>${last.sets} × ${last.reps} · ${last.date}</small></div><div class="mini-card"><small>${tr('Beste Leistung')}</small><h3>${best.load} kg</h3><small>${best.date}</small></div></div><p class="muted tiny">${records.length} ${tr('Trainingseinträge')} · ${tr('Gewicht (kg)')}</p></div>`}
