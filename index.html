function dateISO(d){let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}let monday=(()=>{let d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(12,0,0,0);return d})();const meals=['Frühstück','Mittagessen','Abendessen','Snack','Shakes & Smoothies','Kuchen & Torten'];function original_planner(){return `<div class="row"><h2>Wochenplan</h2><button class="secondary" onclick="monday.setDate(monday.getDate()+7);render()">Nächste →</button></div><button class="secondary" onclick="monday.setDate(monday.getDate()-7);render()">← Vorherige</button>${Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);let day=dateISO(d);return `<div class="day"><h3>${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'short'})}</h3>${meals.map(m=>{let key=day+'|'+m,r=data.recipes.find(x=>x.id===data.plan[key]);return `<div class="card meal-row"><div class="meal-open" ${r?`onclick="openRecipe('${r.id}')"`:''}>${r?.photo?`<img class="mealpic" src="${r.photo}">`:`<div class="mealpic" style="display:grid;place-items:center">${r?'🍽️':'+'}</div>`}<div style="min-width:0"><small>${m}</small><b>${r?esc(r.name):'Noch nichts geplant'}</b>${r?`<small>${Number(r.calories||0)} kcal · Rezept öffnen →</small>`:''}</div></div><select aria-label="${m} auswählen" onchange="setMeal('${key}',this.value)"><option value="">+ Auswählen</option>${data.recipes.map(x=>`<option value="${x.id}" ${r?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}).join('')}</div>`}).join('')}`}function setMeal(k,v){if(v)data.plan[k]=v;else delete data.plan[k];save();render()}function original_shopping(){let totals={};for(let [key,id] of Object.entries(data.plan)){let r=data.recipes.find(r=>r.id===id);if(!r)continue;for(let i of r.ingredients){let k=i.name.trim().toLowerCase()+'|'+i.unit;let t=totals[k]||(totals[k]={name:i.name,unit:i.unit,amount:0,photo:i.photo});t.amount+=Numbe function nutrition(){let day=todayKey(),entries=eatenFor(day);return `<h2>Ernährung & Nährwerte</h2><p class="muted">Trage ein, was du tatsächlich gegessen hast. Dein Wochenplan ist nur eine Planung.</p><div class="card"><h3>Heute · ${new Date().toLocaleDateString('de-DE')}</h3>${nutritionBars(day)}</div><div class="card"><h3>Mahlzeit eintragen</h3><div class="food-row"><select id="foodRecipe">${data.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><input id="foodPortions" type="number" min="0.1" step="0.5" value="1" aria-label="Portionen"><button onclick="addFood()">+</button></div><small>Portionen gemäß den Nährwerten des Rezepts.</small></div><h3>Heute gegessen</h3>${Object.entries(entries).map(([id,n])=>{let r=data.recipes.find(x=>x.id===id);return r?`<div class="card row"><div><b>${esc(r.name)}</b><br><small>${n} Portion(en) · ${Math.round(n*Number(r.calories||0))} kcal</small></div><button class="danger" onclick="removeFood('${id}')">×</button></div>`:''}).join('')||'<div class="card">Noch nichts eingetragen.</div>'}<h3>Deine Tagesziele</h3><div class="card"><div class="grid">${[['Kalorien (kcal)','calories'],['Protein (g)','protein'],['Kohlenhydrate (g)','carbs'],['Fett (g)','fat']].map(([label,k])=>`<label>${label}<input type="number" min="0" id="goal${k}" value="${data.nutritionGoals[k]}"></label>`).join('')}</div><button onclick="saveNutritionGoals()">Ziele speichern</button></div><p class="muted tiny">Die Startwerte sind veränderbare Beispiele, keine medizinisch ermittelten Vorgaben.</p>`}function addFood(){let id=$('foodRecipe')?.value,n=Number($('foodPortions')?.value);if(!id||!Number.isFinite(n)||n<=0)return alert('Bitte Rezept und gültige Portionen wählen.');let d=todayKey();data.eaten[d]||={};data.eaten[d][id]=(Number(data.eaten[d][id])||0)+n;save();render()}function removeFood(id){let d=todayKey();delete data.eaten[d][id];save();render()}function saveNutritionGoals(){for(let k of ['calories','protein','carbs','fat']){let n=Number($('goal'+k).value);if(!Number.isFinite(n)||n<=0)return alert('Bitte positive Tagesziele eintragen.');data.nutritionGoals[k]=n}save();render()}let sub='Training';function original_more(){return `<div class="tabs">${['Training','Einkauf','Fortschritt','Profil','Backup'].map(s=>`<button class="${sub===s?'':'secondary'}" onclick="sub='${s}';render()">${s}</button>`).join('')}</div>${sub==='Training'?training():sub==='Einkauf'?shopping():sub==='Fortschritt'?progress():sub==='Profil'?profile():backup()}`}function training(){let d=trainingDay,stored=data.trainingPlan[d],plan=Array.isArray(stored)?stored:[],legacy=typeof stored==='string'?stored:'',entries=data.workouts.filter(w=>w.date===d),done=!!data.trainingDone[d];return `<h2>Trainingsjournal</h2><div class="row"><button class="secondary" onclick="shiftTraining(-7)">← Woche</button><small>${esc(d)}</small><button class="secondary" onclick="shiftTraining(7)">Woche →</button></div><div class="grid" style="grid-template-columns:repeat(7,1fr);gap:3px;margin:12px 0">${Array.from({length:7},(_,i)=>{let base=new Date(d+'T12:00:00'),offset=(base.getDay()+6)%7;base.setDate(base.getDate()-offset+i);let date=dateISO(base);return `<button class="workday ${d===date?'active':'secondary'}" onclick="selectTrainingDay('${date}')">${['Mo','Di','Mi','Do','Fr','Sa','So'][i]}<br>${base.getDate()}${data.trainingDone[date]?' ✓':''}</button>`}).join('')}</div><div class="card"><h3>Trainingsplan für ${esc(d)}</h3><p class="muted tiny">Trage deine Übungen für diesen Tag direkt ein.</p>${legacy?`<p class="muted">Bisherige Notiz: ${esc(legacy)}</p>`:''}<div id="plannedExercises"></div><button class="secondary" onclick="addPlannedExercise()">+ Übung hinzufügen</button><hr><button onclick="saveTrainingExercises()">Tagesplan speichern</button><button class="${done?'secondary':'done-button'}" style="margin-left:6px;margin-top:8px" onclick="toggleTrainingDone()">${done?'✓ Absolviert – zurücksetzen':'✓ Training absolviert'}</button></div><h3>Bereits dokumentierte Übungen</h3>${entries.map(w=>`<div class="card row"><div><b>${esc(w.exercise)}</b><br><small>${w.sets} × ${w.reps} · ${w.load} kg</small></div><button class="danger" onclick="data.workouts=data.workouts.filter(x=>x.id!==${w.id});save();render()">×</button></div>`).join('')||'<p class="muted">Noch keine absolvierten Übungen dokumentiert.</p>'}<h3>Letzte Einträge</h3>${[...data.workouts].reverse().slice(0,8).map(w=>`<div class="card compact">${esc(w.date)} · ${esc(w.exercise)} · ${w.sets} × ${w.reps} · ${w.load} kg</div>`).join('')||'<p class="muted">Noch keine Einträge.</p>'}`}
let exerciseDraft=[],exerciseDraftDay=null;

function selectTrainingDay(d){trainingDay=d;exerciseDraftDay=null;render()}
function drawPlannedExercises(){let el=$('plannedExercises');if(!el)return;el.innerHTML=exerciseDraft.map((e,i)=>`<div class="exercise-entry"><div class="row"><b>Übung ${i+1}</b><button class="danger" onclick="exerciseDraft.splice(${i},1);drawPlannedExercises()">Entfernen</button></div><label>Übung<input placeholder="z. B. Hip Thrust" value="${esc(e.exercise)}" oninput="exerciseDraft[${i}].exercise=this.value"></label><div class="grid"><label>Gewicht (kg)<input type="number" min="0" step="0.5" value="${esc(e.load)}" oninput="exerciseDraft[${i}].load=this.value"></label><label>Wiederholungen<input type="number" min="1" step="1" value="${esc(e.reps)}" oninput="exerciseDraft[${i}].reps=this.value"></label><label>Sätze<input type="number" min="1" step="1" value="${esc(e.sets)}" oninput="exerciseDraft[${i}].sets=this.value"></label></div></div>`).join('')||'<p class="muted">Noch keine Übungen geplant. Tippe auf „+ Übung hinzufügen“.</p>'}
function addPlannedExercise(){exerciseDraft.push({exercise:'',load:'',reps:10,sets:3});drawPlannedExercises()}
function saveTrainingExercises(){let cleaned=exerciseDraft.filter(e=>String(e.exercise||'').trim()).map(e=>({exercise:String(e.exercise).trim(),load:Number(e.load)||0,reps:Number(e.reps)||0,sets:Number(e.sets)||0}));if(exerciseDraft.length&&!cleaned.length)return alert('Bitte mindestens einen Übungsnamen eingeben.');data.trainingPlan[trainingDay]=cleaned;save();exerciseDraftDay=null;render();alert('Tagesplan gespeichert!')}
function toggleTrainingDone(){let p=data.trainingPlan[trainingDay];if(!data.trainingDone[trainingDay]&&Array.isArray(p)&&p.length){for(let e of p){if(data.workouts.some(w=>w.date===trainingDay&&w.exercise===e.exercise&&Number(w.load)===Number(e.load)&&Number(w.reps)===Number(e.reps)&&Number(w.sets)===Number(e.sets)))continue;data.workouts.push({id:Date.now()+Math.floor(Math.random()*1000000),date:trainingDay,exercise:e.exercise,load:Number(e.load)||0,reps:Number(e.reps)||0,sets:Number(e.sets)||0})}}data.trainingDone[trainingDay]=!data.trainingDone[trainingDay];save();render()}
function shiftTraining(n){let d=new Date(trainingDay+'T12:00:00');d.setDate(d.getDate()+n);trainingDay=dateISO(d);render()}function addWorkout(){let exercise=$('exercise').value.trim();if(!exercise)return alert('Übung eingeben');data.workouts.push({id:Date.now(),date:trainingDay,exercise,load:Number($('load').value),reps:Number($('reps').value),sets:Number($('sets').value)});save();render()}function original_progress(){return `<h2>Dein Fortschritt</h2><div class="card"><label>Gewicht (kg)<input id="weight" type="number" step="0.1" placeholder="z. B. 54,2"></label><button onclick="addWeight()">Gewicht eintragen</button></div><h2>Gewichtsverlauf</h2>${chart(data.weights)}<div class="card"><h3>Körpermaße</h3><div class="grid"><label>Taille (cm)<input id="waist" type="number" step="0.1"></label><label>Hüfte (cm)<input id="hips" type="number" step="0.1"></label></div><button onclick="addMeasure()">Maße speichern</button></div>${data.measurements.slice().reverse().map(m=>`<div class="card">${m.date} · Taille ${m.waist||'–'} cm · Hüfte ${m.hips||'–'} cm</div>`).join('')}<p class="muted tiny">Fortschrittsfotos ergänzen wir später. Körperdaten bleiben zunächst auf diesem Gerät.</p>`}function chart(entries){if(!entries.length)return '<div class="card">Noch keine Gewichtseinträge.</div>';let vals=entries.slice(-20).map(x=>x.value),min=Math.min(...vals)-1,max=Math.max(...vals)+1,pts=vals.map((v,i)=>`${10+i*280/Math.max(1,vals.length-1)},${115-(v-min)/(max-min)*95}`).join(' ');return `<div class="card"><svg viewBox="0 0 300 135" width="100%" role="img" aria-label="Gewichtsverlauf"><polyline points="${pts}" fill="none" stroke="#527f81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><small>${vals[0]} kg → ${vals.at(-1)} kg</small></div>`}function addWeight(){let v=Number($('weight').value);if(!v||v<20||v>500)return alert('Gültiges Gewicht eingeben');data.weights.push({date:dateISO(new Date()),value:v});save();render()}function addMeasure(){data.measurements.push({date:dateISO(new Date()),waist:Number($('waist').value),hips:Number($('hips').value)});save();render()}function profile(){let p=data.profile;return `<h2>Profil & Ziele</h2><div class="card">${[['Gewicht (kg)','weight'],['Größe (cm)','height'],['Alter (Jahre)','age']].map(([n,k])=>`<label>${n}<input type="number" id="p${k}" value="${esc(p[k])}"></label>`).join('')}<label>Aktivität<select id="pactivity">${[['1.2','Wenig aktiv'],['1.375','Leicht aktiv'],['1.55','Moderat aktiv'],['1.725','Sehr aktiv']].map(([v,t])=>`<option value="${v}" ${p.activity===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Ziel<select id="pgoal">${[['lose','Gewicht reduzieren'],['maintain','Gewicht halten'],['gain','Muskelaufbau']].map(([v,t])=>`<option value="${v}" ${p.goal===v?'selected':''}>${t}</option>`).join('')}</select></label><button onclick="saveProfile()">Profil speichern</button></div><p class="muted tiny">Für eine persönliche Kalorienschätzung benötigen wir zusätzlich die passende Berechnungsgrundlage. Bis dahin werden keine vermeintlich exakten Kalorienziele ausgegeben.</p>`}function saveProfile(){for(let k of ['weight','height','age'])data.profile[k]=$('p'+k).value;data.profile.activity=$('pactivity').value;data.profile.goal=$('pgoal').value;save();render();alert('Profil gespeichert')}function backup(){return `<h2>Datensicherung</h2><p>Exportiere regelmäßig deine Daten. Fotos können die Datei vergrößern.</p><button onclick="exportData()">Backup herunterladen</button><label>Backup wiederherstellen<input type="file" accept="application/json" onchange="importData(this)"></label><p class="muted tiny">Achtung: Ein Import ersetzt die aktuellen Daten. Das Löschen von Safari-Website-Daten kann lokale App-Daten entfernen.</p>`}function exportData(){let b=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mein-balance-backup-'+dateISO(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(el){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let obj=JSON.parse(t);if(!Array.isArray(obj.recipes)||typeof obj.plan!=='object')throw Error();if(confirm('Aktuelle Daten durch Backup ersetzen?')){data={...structuredClone(defaults),...obj};for(const k in defaults)if(data[k]===undefined)data[k]=structuredClone(defaults[k]);save();render()}}catch{alert('Ungültige Backup-Datei')}})}

function lfBaseRecipes(){let cats=['Alle','Frühstück','Mittagessen','Abendessen','Snack','Shakes & Smoothies','Kuchen & Torten'];return `<div class="row"><h2>Mein Rezeptbuch</h2><button onclick="editRecipe()">+ Rezept</button></div><input id="search" placeholder="Rezepte suchen …" value="${esc(recipeQuery)}" oninput="recipeQuery=this.value;filterRecipes()"><div class="tabs">${cats.map(c=>`<button class="${recipeCategory===c?'':'secondary'}" onclick="recipeCategory='${c}';render()">${tr(c)}</button>`).join('')}</div><div class="card"><div class="filter-row"><button class="${recipeFavOnly?'':'secondary'} small-action" onclick="recipeFavOnly=!recipeFavOnly;render()">♥ ${tr('Favoriten')}</button><select aria-label="Sortieren" onchange="recipeSort=this.value;filterRecipes()"><option value="name" ${recipeSort==='name'?'selected':''}>${tr('Name')}</option><option value="protein" ${recipeSort==='protein'?'selected':''}>${tr('Protein (hoch)')}</option><option value="calories" ${recipeSort==='calories'?'selected':''}>${tr('Kalorien (niedrig)')}</option></select></div><div class="grid"><label>${tr('Min. Protein')} (g)<input type="number" min="0" value="${recipeProteinMin||''}" oninput="recipeProteinMin=Number(this.value)||0;filterRecipes()"></label><label>${tr('Max. kcal')}<input type="number" min="0" value="${recipeCalMax||''}" oninput="recipeCalMax=Number(this.value)||0;filterRecipes()"></label></div></div><div id="recipeGrid" class="grid" style="margin-top:14px">${recipeListing(recipeQuery)}</div>`}
function recipeListing(q){let rs=data.recipes.filter(r=>(recipeCategory==='Alle'||r.category===recipeCategory)&&r.name.toLowerCase().includes((q||'').toLowerCase())&&(!recipeFavOnly||data.favorites.includes(r.id))&&Number(r.protein||0)>=recipeProteinMin&&(!recipeCalMax||Number(r.calories||0)<=recipeCalMax));rs.sort(recipeSort==='protein'?(a,b)=>Number(b.protein||0)-Number(a.protein||0):recipeSort==='calories'?(a,b)=>Number(a.calories||0)-Number(b.calories||0):(a,b)=>a.name.localeCompare(b.name));if(!rs.length)return `<p class="muted">${tr('Keine Rezepte in dieser Kategorie.')}</p>`;if(recipeCategory!=='Alle')return rs.map(recipeCardEnhanced).join('');let cats=['Frühstück','Mittagessen','Abendessen','Snack','Shakes & Smoothies','Kuchen & Torten'];return [...cats,...new Set(rs.map(r=>r.category).filter(c=>!cats.includes(c)))].map(c=>{let group=rs.filter(r=>r.category===c);return group.length?`<h3 class="category-header">${tr(c)}</h3>${group.map(recipeCardEnhanced).join('')}`:''}).join('')}
function recipeCardEnhanced(r){let fav=data.favorites.includes(r.id);return `<div class="recipe-tile"><button class="fav-btn ${fav?'on':''}" aria-label="${tr('Favoriten')}" onclick="toggleFavorite('${r.id}')">${fav?'♥':'♡'}</button><div class="card" style="margin:0;cursor:pointer" onclick="openRecipe('${r.id}')">${r.photo?`<img class="recipepic" src="${r.photo}">`:`<div class="recipepic" style="display:grid;place-items:center;font-size:36px">🥗</div>`}<b class="user-text">${esc(r.name)}</b><br><small>${tr(r.category||'Rezept')} · ${Number(r.calories||0)} kcal · ${Number(r.protein||0)} g</small></div></div>`}

function lfBaseRecipeDetail(id){let r=data.recipes.find(x=>x.id===id);if(!r)return '';let base=Math.max(.1,Number(r.portions)||1),count=portionView[id]||base,factor=count/base,fav=data.favorites.includes(id);return `<div class="row"><button class="secondary" onclick="closeRecipe()">← ${tr('Zurück')}</button><button class="fav-btn ${fav?'on':''}" onclick="toggleFavorite('${id}')">${fav?'♥':'♡'} ${tr('Favoriten')}</button></div><h2 class="user-text">${esc(r.name)}</h2>${r.photo?`<img class="preview" src="${r.photo}">`:''}<p>${tr(r.category||'Rezept')}</p><div class="card"><div class="setting-row"><b>${tr('Portionen anzeigen')}</b><div class="row"><button class="secondary small-action" onclick="changePortions('${id}',-1)">−</button><b>${count}</b><button class="secondary small-action" onclick="changePortions('${id}',1)">+</button></div></div><hr><div class="grid"><div><small>${tr('Gesamt')}</small><h3>${Math.round((r.calories||0)*count)} kcal</h3></div><div><small>${tr('Protein')}</small><h3>${Math.round((r.protein||0)*count)} g</h3></div></div><small>${r.calories||0} kcal · ${r.protein||0} g ${tr('pro Portion')}</small></div><h2>${tr('Zutaten')}</h2><div class="card">${(r.ingredients||[]).map(i=>`<div class="ingredient-line"><span class="user-text">${esc(i.name)}</span><b>${formatAmount((Number(i.amount)||0)*factor)} ${esc(i.unit)}</b></div>`).join('')}</div><h2>${tr('Zubereitung')}</h2>${(r.steps||[]).map((s,i)=>`<div class="step"><b>${data.preferences.language==='en'?'Step':data.preferences.language==='es'?'Paso':'Schritt'} ${i+1}</b><p class="user-text">${esc(s.text)}</p>${s.photo?`<img class="preview" src="${s.photo}">`:''}</div>`).join('')}<div class="row"><button onclick="editRecipe('${r.id}')">${tr('Bearbeiten')}</button><button class="danger" onclick="deleteRecipe('${r.id}')">${tr('Löschen')}</button></div>`}

function autoFillWeek(){let recipes=data.recipes.filter(r=>r.id!=='demo'||data.recipes.length===1);if(!recipes.length)return alert('Bitte zuerst Rezepte anlegen.');let days=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);return dateISO(d)}),targets=data.nutritionGoals,mealWeights={'Frühstück':.25,'Mittagessen':.35,'Abendessen':.32,'Snack':.08,'Shakes & Smoothies':.08,'Kuchen & Torten':.08};let filled=0;for(let day of days){let assigned=meals.map(m=>data.recipes.find(r=>r.id===data.plan[day+'|'+m])).filter(Boolean),cal=assigned.reduce((s,r)=>s+Number(r.calories||0),0),protein=assigned.reduce((s,r)=>s+Number(r.protein||0),0);for(let meal of meals){let key=day+'|'+meal;if(data.plan[key])continue;let choices=recipes.filter(r=>r.category===meal);if(!choices.length)continue;let ranked=choices.map(r=>{let previous=days.reduce((n,d)=>n+Number(data.plan[d+'|'+meal]===r.id),0),targetCal=targets.calories*(mealWeights[meal]||.1),targetProtein=targets.protein*(mealWeights[meal]||.1);let score=Math.abs(Number(r.calories||0)-targetCal)/Math.max(100,targetCal)+Math.abs(Number(r.protein||0)-targetProtein)/Math.max(10,targetProtein)*.45+previous*.28+Math.max(0,cal+Number(r.calories||0)-targets.calories)/Math.max(200,targets.calories);return {r,score}}).sort((a,b)=>a.score-b.score);data.plan[key]=ranked[0].r.id;cal+=Number(ranked[0].r.calories||0);protein+=Number(ranked[0].r.protein||0);filled++}}save();render();alert(`${filled} ${data.preferences.language==='en'?'meal slots filled':data.preferences.language==='es'?'comidas añadidas':'Mahlzeiten eingetragen'}.`)}

n><b>${formatAmount(Number(i.amount)||0)} ${esc(i.unit)}</b>${i.id?`<button class="danger small-action" onclick="removeShoppingItem('${i.id}')">×</button>`:''}</div>`).join('')}</div>`).join(''):'<div class="card">Plane zuerst Mahlzeiten im Wochenplan.</div>'}<button class="secondary" onclick="data.checked={};save();render()">${tr('Häkchen zurücksetzen')}</button>`}

function progress(){let html=baseProgress(),entries=data.workouts.filter(w=>w.exercise),names=[...new Set(entries.map(w=>String(w.exercise).trim()))].sort(),chosen=window.progressExercise||names[0];if(!names.length)return html+`<div class="card"><h3>${tr('Trainingsentwicklung')}</h3><p>${tr('Noch keine Trainingsdaten vorhanden.')}</p></div>`;if(!names.includes(chosen))chosen=names[0];let records=entries.filter(w=>String(w.exercise).trim()===chosen).sort((a,b)=>a.date.localeCompare(b.date)),last=records.at(-1),best=records.reduce((a,b)=>Number(b.load||0)>Number(a.load||0)?b:a,records[0]);let points=records.slice(-15),loads=points.map(w=>Number(w.load||0)),lo=Math.min(...loads,0),hi=Math.max(...loads,1),line=loads.map((v,i)=>`${10+i*280/Math.max(1,loads.length-1)},${110-90*(v-lo)/Math.max(1,hi-lo)}`).join(' ');return html+`<div class="card"><h3>${tr('Trainingsentwicklung')}</h3><label>${tr('Übung auswählen')}<select onchange="window.progressExercise=this.value;render()">${names.map(n=>`<option value="${esc(n)}" ${n===chosen?'selected':''}>${esc(n)}</option>`).join('')}</select></label><svg viewBox="0 0 300 125" width="100%" role="img" aria-label="${tr('Trainingsentwicklung')}"><polyline points="${line}" fill="none" stroke="#527f81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="grid"><div class="mini-card"><small>${tr('Letzte Leistung')}</small><h3>${last.load} kg</h3><small>${last.sets} × ${last.reps} · ${last.date}</small></div><div class="mini-card"><small>${tr('Beste Leistung')}</small><h3>${best.load} kg</h3><small>${best.date}</small></div></div><p class="muted tiny">${records.length} ${tr('Trainingseinträge')} · ${tr('Gewicht (kg)')}</p></div>`}

let lfMeasureEdit=null,lfWeightEdit=null,lfWorkoutEdit=null,lfProgressTab='Maße',lfMeasureChart='waist',lfPhotoType='Vorne',lfPhotos=[],lfPhotoDB=null;
function lfId(){return 'lf'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function lfQuote(){let d=new Date(),start=new Date(d.getFullYear(),0,1);return LF_QUOTES[Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,1))/86400000)%LF_QUOTES.length]}
function lfOpenDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('Fotospeicher nicht verfügbar'));let r=indexedDB.open('lift-fuel-photos-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function lfPhotoAll(){try{let db=await lfOpenDB();return await new Promise((res,rej)=>{let r=db.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){console.warn(e);return []}}

function lfPhotoResize(file){return new Promise((res,rej)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1000/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.68))};img.onerror=()=>{URL.revokeObjectURL(url);rej(Error('Bild konnte nicht gelesen werden'))};img.src=url})}

function lfSaveWeight(){let v=Number($('lfWeightValue').value),date=$('lfWeightDate').value;if(!date||v<20||v>500)return alert('Bitte Datum und gültiges Gewicht eingeben.');let x={date,value:v};if(lfWeightEdit!==null)data.weights[lfWeightEdit]=x;else data.weights.push(x);lfWeightEdit=null;save();render()}
function lfDeleteWeight(i){if(!confirm('Diesen Gewichtseintrag wirklich löschen?'))return;data.weights.splice(i,1);lfWeightEdit=null;save();render()}
function lfWorkoutsHTML(){let entries=data.workouts.filter(w=>w.exercise);let names=[...new Set(entries.map(w=>String(w.exercise).trim()))].sort();let chosen=window.progressExercise||names[0];if(!names.includes(chosen))chosen=names[0];let records=entries.filter(w=>String(w.exercise).trim()===chosen).sort((a,b)=>a.date.localeCompare(b.date));let edit=lfWorkoutEdit!==null?data.workouts[lfWorkoutEdit]:null;return `<div class="card"><h3>Trainingsentwicklung</h3>${names.length?`<label>Übung auswählen<select onchange="window.progressExercise=this.value;render()">${names.map(n=>`<option ${n===chosen?'selected':''}>${esc(n)}</option>`).join('')}</select></label>${chart(records.map(w=>({date:w.date,value:Number(w.load)||0})))}<p class="muted tiny">Verlauf des Trainingsgewichts in kg</p>`:'<p class="muted">Noch keine Trainingsdaten vorhanden.</p>'}</div>${edit?`<div class="card"><h3>Trainingseintrag bearbeiten</h3><label>Datum<input type="date" id="lfWorkoutDate" value="${esc(edit.date)}"></label><label>Übung<input id="lfWorkoutName" value="${esc(edit.exercise)}"></label><div class="grid"><label>Gewicht (kg)<input type="number" step="0.5" id="lfWorkoutLoad" value="${edit.load}"></label><label>Wiederholungen<input type="number" id="lfWorkoutReps" value="${edit.reps}"></label><label>Sätze<input type="number" id="lfWorkoutSets" value="${edit.sets}"></label></div><button onclick="lfSaveWorkout()">Änderungen speichern</button> <button class="secondary" onclick="lfWorkoutEdit=null;render()">Abbrechen</button></div>`:''}<h3>Trainingseinträge</h3>${data.workouts.map((w,i)=>({w,i})).reverse().map(({w,i})=>`<div class="card row"><span><b>${esc(w.exercise)}</b><br><small>${esc(w.date)} · ${esc(w.sets)} × ${esc(w.reps)} · ${esc(w.load)} kg</small></span><div><button class="secondary small-action" onclick="lfWorkoutEdit=${i};render()">Bearbeiten</button> <button class="danger small-action" onclick="lfDeleteWorkout(${i})">Löschen</button></div></div>`).join('')||'<div class="card">Noch keine Einträge vorhanden.</div>'}`}
function lfSaveWorkout(){let w=data.workouts[lfWorkoutEdit],exercise=$('lfWorkoutName').value.trim(),date=$('lfWorkoutDate').value,load=Number($('lfWorkoutLoad').value),reps=Number($('lfWorkoutReps').value),sets=Number($('lfWorkoutSets').value);if(!exercise||!date||load<0||reps<0||sets<0)return alert('Bitte gültige Angaben eintragen.');Object.assign(w,{exercise,date,load,reps,sets});lfWorkoutEdit=null;save();render()}
function lfDeleteWorkout(i){if(!confirm('Diesen Trainingseintrag wirklich löschen?'))return;data.workouts.splice(i,1);lfWorkoutEdit=null;save();render()}
function progress(){let main=lfProgressNav();if(lfProgressTab==='Fotos')return main+lfPhotosHTML();if(lfProgressTab==='Training')return main+lfWorkoutsHTML();return main+lfWeightsHTML()+lfMeasureForm()+lfMeasureGraph()+'<h3>Gespeicherte Körpermaße</h3>'+data.measurements.map((m,i)=>({m,i})).reverse().map(({m,i})=>`<div class="card"><div class="row"><b>${esc(m.date)}</b><div><button class="secondary small-action" onclick="lfMeasureEdit=${i};render()">Bearbeiten</button> <button class="danger small-action" onclick="lfDeleteMeasure(${i})">Löschen</button></div></div><small>${LF_MEASURES.filter(([k])=>Number(m[k])>0).map(([k,n])=>`${n}: ${esc(m[k])} cm`).join(' · ')||'Keine Angaben'}</small></div>`).join('')}
function lfShareRecipe(id){let r=data.recipes.find(x=>x.id===id);if(!r)return;let lines=[r.name,`${r.category||'Rezept'} · ${r.portions||1} Portion(en)`,`${r.calories||0} kcal · ${r.protein||0} g Protein pro Portion`,'','Zutaten:',...(r.ingredients||[]).map(i=>`• ${i.amount||''} ${i.unit||''} ${i.name}`),'','Zubereitung:',...(r.steps||[]).map((s,i)=>`${i+1}. ${s.text}`)];let content=lines.join('\n');if(navigator.share)navigator.share({title:r.name,text:content}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(content).then(()=>alert('Rezepttext kopiert.'));else prompt('Rezept kopieren:',content)}
function lfExportRecipe(id){let r=data.recipes.find(x=>x.id===id);if(!r)return;lfDownload({type:'lift-fuel-recipe',version:1,recipe:r},'lift-fuel-rezept-'+r.name.toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'-')+'.json')}
function lfDownload(obj,name){let url=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function lfImportRecipe(input){let f=input.files?.[0];if(!f)return;try{if(f.size>8*1024*1024)throw Error('Rezeptdatei ist zu groß (max. 8 MB)');let o=JSON.parse(await f.text()),r=o.recipe;if(o.type!=='lift-fuel-recipe'||!r||typeof r.name!=='string'||!Array.isArray(r.ingredients)||!Array.isArray(r.steps))throw Error('Keine gültige LIFT & FUEL Rezeptdatei');if(!confirm(`Rezept importieren?\n\n${r.name}\n\nZutaten:\n${r.ingredients.slice(0,12).map(i=>'• '+i.amount+' '+i.unit+' '+i.name).join('\n')}\n\nZubereitung:\n${r.steps.slice(0,5).map((st,i)=>(i+1)+'. '+st.text).join('\n').slice(0,1000)}`))return;let duplicate=data.recipes.find(x=>x.name.trim().toLowerCase()===r.name.trim().toLowerCase());if(duplicate&&!confirm('Ein Rezept mit diesem Namen existiert bereits. Trotzdem als Kopie importieren?'))return;let clean=structuredClone(r);clean.id=lfId();data.recipes.push(clean);save();detail=clean.id;render();alert('Rezept importiert!')}catch(e){alert('Import nicht möglich: '+e.message)}finally{input.value=''}}
const lfOldDetail=lfBaseRecipeDetail;
function recipeDetail(id){let html=lfOldDetail(id);let buttons=`<div class="card"><h3>Rezept weitergeben</h3><div class="row" style="flex-wrap:wrap"><button class="secondary" onclick="lfShareRecipe('${id}')">↗ Rezept teilen</button><button class="secondary" onclick="lfExportRecipe('${id}')">↓ Rezeptdatei exportieren</button></div><p class="muted tiny">Teilen versendet lesbaren Text. Eine Rezeptdatei kann in einer anderen LIFT & FUEL App importiert werden.</p></div>`;return html+buttons}
const lfOldRecipes=lfBaseRecipes;
function recipes(){return `<div class="card"><h3>Rezept importieren</h3><label>LIFT & FUEL Rezeptdatei (.json)<input type="file" accept=".json,application/json" onchange="lfImportRecipe(this)"></label><small>Vor dem Import wird eine Vorschau mit Rezeptname, Zutaten und Zubereitung angezeigt.</small></div>`+lfOldRecipes()}
const lfOldShopping=lfBaseShopping;
function shopping(){let html=lfOldShopping();let days=new Set(Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);return dateISO(d)}));let count=Object.keys(data.plan).filter(k=>days.has(k.split('|')[0])).length;return `<div class="lf-week-note">${count?'Die Einkaufsliste enthält Zutaten aus '+count+' geplanten Mahlzeiten dieser Woche.':'Für diese Woche sind keine Mahlzeiten geplant.'} <button class="secondary small-action" onclick="sub='Einkauf';go('Wochenplan')">Wochenplan prüfen →</button></div>`+html}
const lfOldHome=lfBaseHome;
function home(){return `<div class="lf-quote"><div class="lf-quote-label">✦ DEINE TÄGLICHE MOTIVATION</div><div class="lf-quote-text">„${esc(lfQuote())}“</div><small>Ein neuer Gedanke für jeden Tag</small></div>`+lfOldHome()}
function render(){baseRender();document.documentElement.lang='de';document.querySelectorAll('header .language-bar').forEach(x=>x.remove());if(page==='Mehr'&&sub==='Fortschritt'&&lfProgressTab==='Fotos')lfCompareRender()}
function more(){return baseMore()}
function formatAmount(v){return Number(v.toFixed(2)).toLocaleString('de-DE')}
function autoFillWeek(){let recipes=data.recipes.filter(r=>r.id!=='demo'||data.recipes.length===1);if(!recipes.length)return alert('Bitte zuerst Rezepte anlegen.');let days=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);return dateISO(d)}),targets=data.nutritionGoals,mealWeights={'Frühstück':.25,'Mittagessen':.35,'Abendessen':.32,'Snack':.08,'Shakes & Smoothies':.08,'Kuchen & Torten':.08};let filled=0;for(let day of days){let cal=meals.map(m=>data.recipes.find(r=>r.id===data.plan[day+'|'+m])).filter(Boolean).reduce((a,r)=>a+Number(r.calories||0),0);for(let meal of meals){let key=day+'|'+meal;if(data.plan[key])continue;let choices=recipes.filter(r=>r.category===meal);if(!choices.length)continue;let ranked=choices.map(r=>({r,score:Math.abs(Number(r.calories||0)-targets.calories*(mealWeights[meal]||.1))/Math.max(100,targets.calories*(mealWeights[meal]||.1))+days.reduce((n,d)=>n+Number(data.plan[d+'|'+meal]===r.id),0)*.28+Math.max(0,cal+Number(r.calories||0)-targets.calories)/Math.max(200,targets.calories)})).sort((a,b)=>a.score-b.score);data.plan[key]=ranked[0].r.id;cal+=Number(ranked[0].r.calories||0);filled++}}save();render();alert(filled+' Mahlzeiten eingetragen.')}
async function exportData(){try{let photos=await lfPhotoAll();lfDownload({type:'lift-fuel-backup',version:2,data,photos},'lift-fuel-backup-'+todayKey()+'.json');alert('Backup heruntergeladen. Bitte bewahre die Datei sicher auf.')}catch(e){alert('Backup fehlgeschlagen: '+e.message)}}
async function importData(el){let f=el.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text()),incoming=obj.type==='lift-fuel-backup'?obj.data:obj;if(!Array.isArray(incoming?.recipes)||!incoming.plan||typeof incoming.plan!=='object')throw Error('Ungültige Backup-Datei');if(!confirm('Aktuelle Daten durch dieses Backup ersetzen? Vorher am besten ein Backup der aktuellen Daten herunterladen.'))return;if(Array.isArray(obj.photos)){for(let p of obj.photos){if(p&&p.id&&p.image&&p.date)await lfPhotoPut(p)}}data={...structuredClone(defaults),...incoming};for(let k in defaults)if(data[k]===undefined)data[k]=structuredClone(defaults[k]);save();await lfLoadPhotos();render();alert('Backup wiederhergestellt.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}finally{el.value=''}}
function backup(){return `<h2>Datensicherung</h2><div class="card"><p>Dein Backup enthält Rezepte, Pläne, Fortschrittsdaten und Fortschrittsfotos. Die Datei kann durch Fotos groß werden.</p><button onclick="exportData()">Vollständiges Backup herunterladen</button><label>Backup wiederherstellen<input type="file" accept=".json,application/json" onchange="importData(this)"></label><p class="muted tiny">Ein Backup-Import ersetzt die aktuellen App-Daten. Bitte lösche keine Safari-Website-Daten, wenn du sie behalten möchtest.</p></div>`}

lfLoadPhotos();
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
