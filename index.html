<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9e7e8"><link rel="manifest" href="manifest.webmanifest"><title>LIFT &amp; FUEL</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#263b40;background:#edf3f2}*{box-sizing:border-box}body{margin:0}.app{max-width:640px;margin:auto;min-height:100vh;padding:22px 18px 100px}h1{font-family:Georgia,serif;font-weight:500;font-size:34px;margin:8px 0}h2{font-family:Georgia,serif;font-size:24px;font-weight:500}small,.muted{color:#6a8084}.hero{background:#dce8e9;padding:22px;border-radius:22px;margin-bottom:20px}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 15px #2343 0}.card{box-shadow:0 3px 14px #243b4010}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce6e5;display:flex;justify-content:center;padding:9px 4px max(12px,env(safe-area-inset-bottom));gap:2px}.nav button{font-size:11px;flex:1;max-width:110px;padding:8px 2px;background:none;color:#60777b}.nav button.active{color:#244f58;font-weight:700}button{border:0;border-radius:12px;padding:12px 15px;background:#50777d;color:white;font-weight:600;cursor:pointer}button.secondary{background:#e5eeee;color:#365e65}button.danger{background:#f7e4e4;color:#a34343}input,select,textarea{width:100%;border:1px solid #d5e1e0;border-radius:11px;padding:12px;font:inherit;background:#fff;color:#263b40;margin:5px 0 10px}label{display:block;font-size:13px;color:#526e73;margin-top:10px}textarea{min-height:80px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}.recipepic{width:100%;height:125px;object-fit:cover;border-radius:12px;background:#e8eeee}.thumb{width:48px;height:48px;object-fit:cover;border-radius:9px;background:#e9f0ee}.pill{display:inline-block;background:#e5eeee;border-radius:99px;padding:5px 9px;font-size:12px;margin:3px}.hidden{display:none}.bar{height:8px;border-radius:8px;background:#e6eeee;overflow:hidden}.bar>div{height:100%;background:#739c9b}.tiny{font-size:12px}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap}.step{border-left:3px solid #9dbab7;padding-left:12px;margin:14px 0}.preview{max-width:100%;max-height:220px;object-fit:cover;border-radius:12px}.day{margin-top:15px;padding-top:8px;border-top:1px solid #e1e9e8}hr{border:0;border-top:1px solid #e1e9e8;margin:15px 0}#notice{font-size:13px;color:#50777d}
.ingredient-line{padding:12px 3px;border-bottom:1px solid #dce6e5;display:flex;justify-content:space-between;gap:12px;align-items:center}.ingredient-line span{flex:1}.mealpic{width:68px;height:68px;border-radius:12px;object-fit:cover;background:#e6eeee}.meal-open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}.meal-open b{display:block}.meal-row{display:flex;gap:8px;align-items:center}.meal-row select{width:42%;font-size:12px}.macro{margin:13px 0}.macro .bar{margin-top:7px}.category-header{grid-column:1/-1;margin:14px 0 0}.workday{padding:9px 10px}.workday.active{background:#50777d;color:white}.food-row{display:flex;gap:8px;align-items:center}.food-row select{flex:1}.food-row input{width:85px}.food-row button{padding:10px}.compact{font-size:13px}  .exercise-entry{border:1px solid #d9e5e6;border-radius:14px;padding:12px;margin:12px 0;background:#f7faf9}.exercise-entry .row button{padding:7px 9px;font-size:12px}.done-button{background:#426e74}.app header h1{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:30px;font-weight:800;letter-spacing:.06em;color:#234a55}.app header small{letter-spacing:.14em;font-size:10px} </style></head><body><div class="app"><header><div style="display:flex;align-items:center;gap:12px"><img src="lift-fuel-icon.png" alt="Lift & Fuel Logo" style="width:58px;height:58px;border-radius:15px;object-fit:cover"><div><small>TRAIN · EAT · PROGRESS</small><h1>LIFT &amp; FUEL</h1></div></div></header><main id="view"></main></div><nav class="nav" id="nav"></nav><script>
const KEY='mein-balance-v1';const defaults={recipes:[{id:'demo',name:'Tofu-Reis-Bowl',category:'Abendessen',portions:1,calories:650,protein:35,carbs:78,fat:22,ingredients:[{name:'Reis',amount:100,unit:'g'},{name:'Räuchertofu',amount:150,unit:'g'},{name:'Brokkoli',amount:200,unit:'g'},{name:'Paprika',amount:100,unit:'g'}],steps:[{text:'Reis nach Packungsangabe kochen.'},{text:'Brokkoli und Paprika klein schneiden und garen.'},{text:'Tofu anbraten und alles in einer Schüssel anrichten.'}]}],plan:{},checked:{},weights:[],measurements:[],workouts:[],profile:{weight:'',height:'',age:'',activity:'1.55',goal:'maintain'},eaten:{},nutritionGoals:{calories:2100,protein:100,carbs:260,fat:70},trainingPlan:{},trainingDone:{}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{data=structuredClone(defaults)};for(const k in defaults)if(data[k]===undefined)data[k]=structuredClone(defaults[k]);let page='Start',detail=null,editing=null,detailFrom=null,recipeCategory='Alle',trainingDay=dateISO(new Date());const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Speicher voll. Bitte Fotos verkleinern und Backup exportieren.')}}function go(p){page=p;detail=null;detailFrom=null;render();scrollTo(0,0)}function openRecipe(id){detailFrom=page;detail=id;render();scrollTo(0,0)}function closeRecipe(){detail=null;page=detailFrom||page;detailFrom=null;render()}const navs=[['Start','⌂'],['Rezepte','▤'],['Wochenplan','▦'],['Ernährung','◉'],['Mehr','☰']];function render(){ $('nav').innerHTML=navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${i}<br>${n}</button>`).join('');$('view').innerHTML=detail?recipeDetail(detail):page==='Start'?home():page==='Rezepte'?recipes():page==='Wochenplan'?planner():page==='Ernährung'?nutrition():more();if(page==='Mehr'&&sub==='Training'&&!detail){ensureExerciseDraft();drawPlannedExercises()}}function todayKey(){return dateISO(new Date())}function eatenFor(day){return data.eaten[day]||{}}function mealTotals(day){let entries=eatenFor(day),sum={calories:0,protein:0,carbs:0,fat:0};for(let [id,portions] of Object.entries(entries)){let r=data.recipes.find(x=>x.id===id);if(!r)continue;for(let k in sum)sum[k]+=Number(r[k]||0)*Number(portions||0)}return sum}function nutritionBars(day){let t=mealTotals(day),g=data.nutritionGoals;return [['Kalorien','calories','kcal'],['Protein','protein','g'],['Kohlenhydrate','carbs','g'],['Fett','fat','g']].map(([label,key,unit])=>`<div class="macro"><div class="row"><b>${label}</b><small>${Math.round(t[key])} / ${g[key]} ${unit}</small></div><div class="bar"><div style="width:${Math.min(100,t[key]/Math.max(1,g[key])*100)}%"></div></div></div>`).join('')}function home(){let day=todayKey(),planned=meals.map(m=>data.plan[day+'|'+m]).filter(Boolean).map(id=>data.recipes.find(r=>r.id===id)).filter(Boolean),cal=planned.reduce((a,r)=>a+Number(r.calories||0),0);return `<div class="hero"><small>Willkommen zurück</small><h2>Gut essen. Stark werden.</h2><p>Dein Training, deine Ernährung und deine Fortschritte an einem Ort.</p><button onclick="go('Wochenplan')">Woche planen →</button></div><div class="card"><div class="row"><h3>Heute gegessen</h3><button class="secondary" onclick="go('Ernährung')">Eintragen →</button></div>${nutritionBars(day)}</div><div class="grid"><div class="card"><small>Heute geplant</small><h2>${cal} kcal</h2><small>Nicht automatisch gegessen</small></div><div class="card"><small>Rezepte</small><h2>${data.recipes.length}</h2><small>Im Rezeptbuch</small></div></div><h2>Deine Bereiche</h2><div class="grid">${[['Rezepte','Rezeptbuch'],['Wochenplan','Wochenplan'],['Ernährung','Nährwerte'],['Mehr','Training & Einkauf']].map(([p,t])=>`<button class="secondary" onclick="go('${p}')">${t} →</button>`).join('')}</div><p class="muted tiny">Nährwerte basieren auf den von dir eingetragenen Rezeptwerten.</p>`}function recipes(){let cats=['Alle','Frühstück','Mittagessen','Abendessen','Snack'];return `<div class="row"><h2>Mein Rezeptbuch</h2><button onclick="editRecipe()">+ Rezept</button></div><input id="search" placeholder="Rezepte suchen …" oninput="filterRecipes()"><div class="tabs">${cats.map(c=>`<button class="${recipeCategory===c?'':'secondary'}" onclick="recipeCategory='${c}';render()">${c}</button>`).join('')}</div><div id="recipeGrid" class="grid" style="margin-top:14px">${recipeListing('')}</div>`}function recipeListing(q){let rs=data.recipes.filter(r=>(recipeCategory==='Alle'||r.category===recipeCategory)&&r.name.toLowerCase().includes(q.toLowerCase()));if(!rs.length)return '<p class="muted">Keine Rezepte in dieser Kategorie.</p>';if(recipeCategory!=='Alle')return rs.map(recipeCard).join('');return ['Frühstück','Mittagessen','Abendessen','Snack',...new Set(rs.map(r=>r.category).filter(c=>!['Frühstück','Mittagessen','Abendessen','Snack'].includes(c)))].map(c=>{let group=rs.filter(r=>r.category===c);return group.length?`<h3 class="category-header">${esc(c)}</h3>${group.map(recipeCard).join('')}`:''}).join('')}function recipeCard(r){return `<div class="card" style="margin:0;cursor:pointer" onclick="openRecipe('${r.id}')">${r.photo?`<img class="recipepic" src="${r.photo}">`:`<div class="recipepic" style="display:grid;place-items:center;font-size:36px">🥗</div>`}<b>${esc(r.name)}</b><br><small>${esc(r.category||'Rezept')} · ${Number(r.calories||0)} kcal</small></div>`}function filterRecipes(){let q=$('search').value.toLowerCase();$('recipeGrid').innerHTML=recipeListing(q)}function recipeDetail(id){let r=data.recipes.find(x=>x.id===id);if(!r)return '';return `<button class="secondary" onclick="closeRecipe()">← Zurück</button><h2>${esc(r.name)}</h2>${r.photo?`<img class="preview" src="${r.photo}">`:''}<p>${esc(r.category)} · ${r.portions||1} Portion(en)</p><div class="card"><b>${r.calories||0} kcal</b> · ${r.protein||0} g Protein · ${r.carbs||0} g KH · ${r.fat||0} g Fett <small>(pro Portion)</small></div><h2>Zutaten</h2><div class="card">${r.ingredients.map(i=>`<div class="ingredient-line"><span>${esc(i.name)}</span><b>${esc(i.amount)} ${esc(i.unit)}</b></div>`).join('')}</div><h2>Zubereitung</h2>${r.steps.map((s,i)=>`<div class="step"><b>Schritt ${i+1}</b><p>${esc(s.text)}</p>${s.photo?`<img class="preview" src="${s.photo}">`:''}</div>`).join('')}<div class="row"><button onclick="editRecipe('${r.id}')">Bearbeiten</button><button class="danger" onclick="deleteRecipe('${r.id}')">Löschen</button></div>`}function deleteRecipe(id){if(confirm('Rezept wirklich löschen?')){data.recipes=data.recipes.filter(r=>r.id!==id);save();detail=null;render()}}function editRecipe(id){editing=id||null;let r=data.recipes.find(r=>r.id===id)||{name:'',category:'Mittagessen',portions:1,calories:'',protein:'',carbs:'',fat:'',ingredients:[],steps:[]};window.draft=structuredClone(r);$('view').innerHTML=`<button class="secondary" onclick="detail=null;render()">← Zurück</button><h2>${id?'Rezept bearbeiten':'Neues Rezept'}</h2><label>Rezeptname<input id="rname" value="${esc(r.name)}"></label><label>Kategorie<select id="rcat">${['Frühstück','Mittagessen','Abendessen','Snack'].map(x=>`<option ${r.category===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Rezeptfoto<input type="file" accept="image/*" onchange="imageInput(this, v=>draft.photo=v)"></label>${r.photo?`<img class="preview" src="${r.photo}">`:''}<div class="grid">${[['Portionen','portions'],['Kalorien pro Portion','calories'],['Protein (g)','protein'],['Kohlenhydrate (g)','carbs'],['Fett (g)','fat']].map(([n,k])=>`<label>${n}<input type="number" id="r${k}" value="${r[k]??''}"></label>`).join('')}</div><h2>Zutaten</h2><div id="ingredientFields"></div><button class="secondary" onclick="addIngredient()">+ Zutat</button><h2>Anleitung mit Bildern</h2><div id="stepFields"></div><button class="secondary" onclick="addStep()">+ Schritt</button><hr><button onclick="saveRecipe()">Rezept speichern</button>`;drawIngredients();drawSteps()}function drawIngredients(){let el=$('ingredientFields');if(!el)return;el.innerHTML=draft.ingredients.map((i,n)=>`<div class="card"><label>Zutat<input value="${esc(i.name)}" oninput="draft.ingredients[${n}].name=this.value"></label><div class="grid"><label>Menge<input type="number" value="${esc(i.amount)}" oninput="draft.ingredients[${n}].amount=this.value"></label><label>Einheit<input value="${esc(i.unit)}" oninput="draft.ingredients[${n}].unit=this.value"></label></div><button class="danger" onclick="draft.ingredients.splice(${n},1);drawIngredients()">Entfernen</button></div>`).join('')}function addIngredient(){draft.ingredients.push({name:'',amount:'',unit:'g'});drawIngredients()}function drawSteps(){let el=$('stepFields');if(!el)return;el.innerHTML=draft.steps.map((s,n)=>`<div class="card"><b>Schritt ${n+1}</b><textarea oninput="draft.steps[${n}].text=this.value">${esc(s.text)}</textarea>${s.photo?`<img class="preview" src="${s.photo}">`:''}<label>Schrittbild<input type="file" accept="image/*" onchange="imageInput(this,v=>{draft.steps[${n}].photo=v;drawSteps()})"></label><button class="danger" onclick="draft.steps.splice(${n},1);drawSteps()">Entfernen</button></div>`).join('')}function addStep(){draft.steps.push({text:''});drawSteps()}function imageInput(input,cb){let f=input.files?.[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.65));URL.revokeObjectURL(url)};img.src=url}function saveRecipe(){let name=$('rname').value.trim();if(!name)return alert('Bitte Rezeptnamen eingeben');Object.assign(draft,{id:editing||'r'+Date.now(),name,category:$('rcat').value});for(let k of ['portions','calories','protein','carbs','fat'])draft[k]=Number($('r'+k).value)||0;if(editing)data.recipes=data.recipes.map(r=>r.id===editing?draft:r);else data.recipes.push(draft);save();detail=draft.id;render()}
function dateISO(d){let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}let monday=(()=>{let d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(12,0,0,0);return d})();const meals=['Frühstück','Mittagessen','Abendessen','Snack'];function planner(){return `<div class="row"><h2>Wochenplan</h2><button class="secondary" onclick="monday.setDate(monday.getDate()+7);render()">Nächste →</button></div><button class="secondary" onclick="monday.setDate(monday.getDate()-7);render()">← Vorherige</button>${Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);let day=dateISO(d);return `<div class="day"><h3>${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'short'})}</h3>${meals.map(m=>{let key=day+'|'+m,r=data.recipes.find(x=>x.id===data.plan[key]);return `<div class="card meal-row"><div class="meal-open" ${r?`onclick="openRecipe('${r.id}')"`:''}>${r?.photo?`<img class="mealpic" src="${r.photo}">`:`<div class="mealpic" style="display:grid;place-items:center">${r?'🍽️':'+'}</div>`}<div style="min-width:0"><small>${m}</small><b>${r?esc(r.name):'Noch nichts geplant'}</b>${r?`<small>${Number(r.calories||0)} kcal · Rezept öffnen →</small>`:''}</div></div><select aria-label="${m} auswählen" onchange="setMeal('${key}',this.value)"><option value="">+ Auswählen</option>${data.recipes.map(x=>`<option value="${x.id}" ${r?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}).join('')}</div>`}).join('')}`}function setMeal(k,v){if(v)data.plan[k]=v;else delete data.plan[k];save();render()}function shopping(){let totals={};for(let [key,id] of Object.entries(data.plan)){let r=data.recipes.find(r=>r.id===id);if(!r)continue;for(let i of r.ingredients){let k=i.name.trim().toLowerCase()+'|'+i.unit;let t=totals[k]||(totals[k]={name:i.name,unit:i.unit,amount:0,photo:i.photo});t.amount+=Number(i.amount)||0}}return `<h2>Einkaufsliste</h2><p class="muted">Automatisch aus allen geplanten Mahlzeiten erstellt. Gleiche Zutaten und Einheiten werden zusammengefasst.</p>${Object.entries(totals).length?Object.entries(totals).map(([k,i])=>`<div class="row card"><input type="checkbox" style="width:22px;margin:0" ${data.checked[k]?'checked':''} onchange="data.checked['${esc(k)}']=this.checked;save()">${i.photo?`<img class="thumb" src="${i.photo}">`:''}<span style="flex:1">${esc(i.name)}</span><b>${i.amount} ${esc(i.unit)}</b></div>`).join(''):'<div class="card">Plane zuerst Mahlzeiten im Wochenplan.</div>'}<button class="secondary" onclick="data.checked={};save();render()">Häkchen zurücksetzen</button>`}
function nutrition(){let day=todayKey(),entries=eatenFor(day);return `<h2>Ernährung & Nährwerte</h2><p class="muted">Trage ein, was du tatsächlich gegessen hast. Dein Wochenplan ist nur eine Planung.</p><div class="card"><h3>Heute · ${new Date().toLocaleDateString('de-DE')}</h3>${nutritionBars(day)}</div><div class="card"><h3>Mahlzeit eintragen</h3><div class="food-row"><select id="foodRecipe">${data.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><input id="foodPortions" type="number" min="0.1" step="0.5" value="1" aria-label="Portionen"><button onclick="addFood()">+</button></div><small>Portionen gemäß den Nährwerten des Rezepts.</small></div><h3>Heute gegessen</h3>${Object.entries(entries).map(([id,n])=>{let r=data.recipes.find(x=>x.id===id);return r?`<div class="card row"><div><b>${esc(r.name)}</b><br><small>${n} Portion(en) · ${Math.round(n*Number(r.calories||0))} kcal</small></div><button class="danger" onclick="removeFood('${id}')">×</button></div>`:''}).join('')||'<div class="card">Noch nichts eingetragen.</div>'}<h3>Deine Tagesziele</h3><div class="card"><div class="grid">${[['Kalorien (kcal)','calories'],['Protein (g)','protein'],['Kohlenhydrate (g)','carbs'],['Fett (g)','fat']].map(([label,k])=>`<label>${label}<input type="number" min="0" id="goal${k}" value="${data.nutritionGoals[k]}"></label>`).join('')}</div><button onclick="saveNutritionGoals()">Ziele speichern</button></div><p class="muted tiny">Die Startwerte sind veränderbare Beispiele, keine medizinisch ermittelten Vorgaben.</p>`}function addFood(){let id=$('foodRecipe')?.value,n=Number($('foodPortions')?.value);if(!id||!Number.isFinite(n)||n<=0)return alert('Bitte Rezept und gültige Portionen wählen.');let d=todayKey();data.eaten[d]||={};data.eaten[d][id]=(Number(data.eaten[d][id])||0)+n;save();render()}function removeFood(id){let d=todayKey();delete data.eaten[d][id];save();render()}function saveNutritionGoals(){for(let k of ['calories','protein','carbs','fat']){let n=Number($('goal'+k).value);if(!Number.isFinite(n)||n<=0)return alert('Bitte positive Tagesziele eintragen.');data.nutritionGoals[k]=n}save();render()}let sub='Training';function more(){return `<div class="tabs">${['Training','Einkauf','Fortschritt','Profil','Backup'].map(s=>`<button class="${sub===s?'':'secondary'}" onclick="sub='${s}';render()">${s}</button>`).join('')}</div>${sub==='Training'?training():sub==='Einkauf'?shopping():sub==='Fortschritt'?progress():sub==='Profil'?profile():backup()}`}function training(){let d=trainingDay,stored=data.trainingPlan[d],plan=Array.isArray(stored)?stored:[],legacy=typeof stored==='string'?stored:'',entries=data.workouts.filter(w=>w.date===d),done=!!data.trainingDone[d];return `<h2>Trainingsjournal</h2><div class="row"><button class="secondary" onclick="shiftTraining(-7)">← Woche</button><small>${esc(d)}</small><button class="secondary" onclick="shiftTraining(7)">Woche →</button></div><div class="grid" style="grid-template-columns:repeat(7,1fr);gap:3px;margin:12px 0">${Array.from({length:7},(_,i)=>{let base=new Date(d+'T12:00:00'),offset=(base.getDay()+6)%7;base.setDate(base.getDate()-offset+i);let date=dateISO(base);return `<button class="workday ${d===date?'active':'secondary'}" onclick="selectTrainingDay('${date}')">${['Mo','Di','Mi','Do','Fr','Sa','So'][i]}<br>${base.getDate()}${data.trainingDone[date]?' ✓':''}</button>`}).join('')}</div><div class="card"><h3>Trainingsplan für ${esc(d)}</h3><p class="muted tiny">Trage deine Übungen für diesen Tag direkt ein.</p>${legacy?`<p class="muted">Bisherige Notiz: ${esc(legacy)}</p>`:''}<div id="plannedExercises"></div><button class="secondary" onclick="addPlannedExercise()">+ Übung hinzufügen</button><hr><button onclick="saveTrainingExercises()">Tagesplan speichern</button><button class="${done?'secondary':'done-button'}" style="margin-left:6px;margin-top:8px" onclick="toggleTrainingDone()">${done?'✓ Absolviert – zurücksetzen':'✓ Training absolviert'}</button></div><h3>Bereits dokumentierte Übungen</h3>${entries.map(w=>`<div class="card row"><div><b>${esc(w.exercise)}</b><br><small>${w.sets} × ${w.reps} · ${w.load} kg</small></div><button class="danger" onclick="data.workouts=data.workouts.filter(x=>x.id!==${w.id});save();render()">×</button></div>`).join('')||'<p class="muted">Noch keine absolvierten Übungen dokumentiert.</p>'}<h3>Letzte Einträge</h3>${[...data.workouts].reverse().slice(0,8).map(w=>`<div class="card compact">${esc(w.date)} · ${esc(w.exercise)} · ${w.sets} × ${w.reps} · ${w.load} kg</div>`).join('')||'<p class="muted">Noch keine Einträge.</p>'}`}
let exerciseDraft=[],exerciseDraftDay=null;
function ensureExerciseDraft(){if(exerciseDraftDay!==trainingDay){let p=data.trainingPlan[trainingDay];exerciseDraft=Array.isArray(p)?structuredClone(p):[];exerciseDraftDay=trainingDay}}
function selectTrainingDay(d){trainingDay=d;exerciseDraftDay=null;render()}
function drawPlannedExercises(){let el=$('plannedExercises');if(!el)return;el.innerHTML=exerciseDraft.map((e,i)=>`<div class="exercise-entry"><div class="row"><b>Übung ${i+1}</b><button class="danger" onclick="exerciseDraft.splice(${i},1);drawPlannedExercises()">Entfernen</button></div><label>Übung<input placeholder="z. B. Hip Thrust" value="${esc(e.exercise)}" oninput="exerciseDraft[${i}].exercise=this.value"></label><div class="grid"><label>Gewicht (kg)<input type="number" min="0" step="0.5" value="${esc(e.load)}" oninput="exerciseDraft[${i}].load=this.value"></label><label>Wiederholungen<input type="number" min="1" step="1" value="${esc(e.reps)}" oninput="exerciseDraft[${i}].reps=this.value"></label><label>Sätze<input type="number" min="1" step="1" value="${esc(e.sets)}" oninput="exerciseDraft[${i}].sets=this.value"></label></div></div>`).join('')||'<p class="muted">Noch keine Übungen geplant. Tippe auf „+ Übung hinzufügen“.</p>'}
function addPlannedExercise(){exerciseDraft.push({exercise:'',load:'',reps:10,sets:3});drawPlannedExercises()}
function saveTrainingExercises(){let cleaned=exerciseDraft.filter(e=>String(e.exercise||'').trim()).map(e=>({exercise:String(e.exercise).trim(),load:Number(e.load)||0,reps:Number(e.reps)||0,sets:Number(e.sets)||0}));if(exerciseDraft.length&&!cleaned.length)return alert('Bitte mindestens einen Übungsnamen eingeben.');data.trainingPlan[trainingDay]=cleaned;save();exerciseDraftDay=null;render();alert('Tagesplan gespeichert!')}
function toggleTrainingDone(){let p=data.trainingPlan[trainingDay];if(!data.trainingDone[trainingDay]&&Array.isArray(p)&&p.length){for(let e of p){data.workouts.push({id:Date.now()+Math.floor(Math.random()*1000000),date:trainingDay,exercise:e.exercise,load:Number(e.load)||0,reps:Number(e.reps)||0,sets:Number(e.sets)||0})}}data.trainingDone[trainingDay]=!data.trainingDone[trainingDay];save();render()}
function shiftTraining(n){let d=new Date(trainingDay+'T12:00:00');d.setDate(d.getDate()+n);trainingDay=dateISO(d);render()}function addWorkout(){let exercise=$('exercise').value.trim();if(!exercise)return alert('Übung eingeben');data.workouts.push({id:Date.now(),date:trainingDay,exercise,load:Number($('load').value),reps:Number($('reps').value),sets:Number($('sets').value)});save();render()}function progress(){return `<h2>Dein Fortschritt</h2><div class="card"><label>Gewicht (kg)<input id="weight" type="number" step="0.1" placeholder="z. B. 54,2"></label><button onclick="addWeight()">Gewicht eintragen</button></div><h2>Gewichtsverlauf</h2>${chart(data.weights)}<div class="card"><h3>Körpermaße</h3><div class="grid"><label>Taille (cm)<input id="waist" type="number" step="0.1"></label><label>Hüfte (cm)<input id="hips" type="number" step="0.1"></label></div><button onclick="addMeasure()">Maße speichern</button></div>${data.measurements.slice().reverse().map(m=>`<div class="card">${m.date} · Taille ${m.waist||'–'} cm · Hüfte ${m.hips||'–'} cm</div>`).join('')}<p class="muted tiny">Fortschrittsfotos ergänzen wir später. Körperdaten bleiben zunächst auf diesem Gerät.</p>`}function chart(entries){if(!entries.length)return '<div class="card">Noch keine Gewichtseinträge.</div>';let vals=entries.slice(-20).map(x=>x.value),min=Math.min(...vals)-1,max=Math.max(...vals)+1,pts=vals.map((v,i)=>`${10+i*280/Math.max(1,vals.length-1)},${115-(v-min)/(max-min)*95}`).join(' ');return `<div class="card"><svg viewBox="0 0 300 135" width="100%" role="img" aria-label="Gewichtsverlauf"><polyline points="${pts}" fill="none" stroke="#527f81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><small>${vals[0]} kg → ${vals.at(-1)} kg</small></div>`}function addWeight(){let v=Number($('weight').value);if(!v||v<20||v>500)return alert('Gültiges Gewicht eingeben');data.weights.push({date:dateISO(new Date()),value:v});save();render()}function addMeasure(){data.measurements.push({date:dateISO(new Date()),waist:Number($('waist').value),hips:Number($('hips').value)});save();render()}function profile(){let p=data.profile;return `<h2>Profil & Ziele</h2><div class="card">${[['Gewicht (kg)','weight'],['Größe (cm)','height'],['Alter (Jahre)','age']].map(([n,k])=>`<label>${n}<input type="number" id="p${k}" value="${esc(p[k])}"></label>`).join('')}<label>Aktivität<select id="pactivity">${[['1.2','Wenig aktiv'],['1.375','Leicht aktiv'],['1.55','Moderat aktiv'],['1.725','Sehr aktiv']].map(([v,t])=>`<option value="${v}" ${p.activity===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Ziel<select id="pgoal">${[['lose','Gewicht reduzieren'],['maintain','Gewicht halten'],['gain','Muskelaufbau']].map(([v,t])=>`<option value="${v}" ${p.goal===v?'selected':''}>${t}</option>`).join('')}</select></label><button onclick="saveProfile()">Profil speichern</button></div><p class="muted tiny">Für eine persönliche Kalorienschätzung benötigen wir zusätzlich die passende Berechnungsgrundlage. Bis dahin werden keine vermeintlich exakten Kalorienziele ausgegeben.</p>`}function saveProfile(){for(let k of ['weight','height','age'])data.profile[k]=$('p'+k).value;data.profile.activity=$('pactivity').value;data.profile.goal=$('pgoal').value;save();render();alert('Profil gespeichert')}function backup(){return `<h2>Datensicherung</h2><p>Exportiere regelmäßig deine Daten. Fotos können die Datei vergrößern.</p><button onclick="exportData()">Backup herunterladen</button><label>Backup wiederherstellen<input type="file" accept="application/json" onchange="importData(this)"></label><p class="muted tiny">Achtung: Ein Import ersetzt die aktuellen Daten. Das Löschen von Safari-Website-Daten kann lokale App-Daten entfernen.</p>`}function exportData(){let b=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mein-balance-backup-'+dateISO(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(el){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let obj=JSON.parse(t);if(!Array.isArray(obj.recipes)||typeof obj.plan!=='object')throw Error();if(confirm('Aktuelle Daten durch Backup ersetzen?')){data={...structuredClone(defaults),...obj};for(const k in defaults)if(data[k]===undefined)data[k]=structuredClone(defaults[k]);save();render()}}catch{alert('Ungültige Backup-Datei')}})}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
